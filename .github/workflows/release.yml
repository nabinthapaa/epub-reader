name: Release

on:
  push:
    tags: ['v*']

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libxcb1-dev libx11-dev

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          version="${GITHUB_REF_NAME}"
          staging="folio-${version}-x86_64-linux"
          mkdir -p "$staging"
          cp target/release/folio "$staging/"
          strip "$staging/folio"
          cp README.md LICENSE packaging/folio.desktop packaging/folio.svg "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          sha256sum "$staging.tar.gz" > "$staging.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            folio-*-x86_64-linux.tar.gz
            folio-*-x86_64-linux.tar.gz.sha256
