[workspace]
members = ["crates/folio-core", "crates/folio"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nabinthapaa/epub-reader"

[workspace.dependencies]
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
