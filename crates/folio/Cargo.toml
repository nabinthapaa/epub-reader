[package]
name = "folio"
version.workspace = true
edition.workspace = true
license.workspace = true

# Both a library and a cdylib: the desktop binary and Android's android_main
# share everything above the entry point.
[lib]
name = "folio"
crate-type = ["lib", "cdylib"]

[dependencies]
folio-core = { path = "../folio-core" }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
slint = "1.17"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
image = "0.25.10"
directories = "6.0.0"
cosmic-text = "0.19.0"

[build-dependencies]
slint-build = "1.17"

# A file dialog and a browser launcher only make sense on a desktop; neither
# crate builds for Android.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"
open = "5.4.4"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.17", features = ["backend-android-activity-06"] }

[package.metadata.android]
package = "dev.folio.reader"
build_targets = ["aarch64-linux-android"]
apk_name = "folio"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 34

[package.metadata.android.application]
label = "Folio"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.17.0", features = ["renderer-software"] }
